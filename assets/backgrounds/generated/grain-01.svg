<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
<title>Gradient hat nhieu 1</title>
<desc>Recolor: set the CSS variables bg-bg, bg-c1, bg-c2, bg-c3 (each prefixed with two hyphens) on the parent element when embedding the SVG inline; currentColor strokes follow the color property.</desc>
<defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg-c1,#6366f1)"/><stop offset="1" style="stop-color:var(--bg-c2,#ec4899)"/></linearGradient></defs>
<rect width="100%" height="100%" style="fill:var(--bg-bg,#0f172a)"/>
<rect width="100%" height="100%" fill="url(#lg)" fill-opacity="0.9"/><rect width="100%" height="100%" filter="url(#n)" opacity="0.18" style="mix-blend-mode:overlay"/>
</svg>
