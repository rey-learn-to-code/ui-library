<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
<title>Luoi 40px mo dan</title>
<desc>Recolor: set the CSS variables bg-bg, bg-c1, bg-c2, bg-c3 (each prefixed with two hyphens) on the parent element when embedding the SVG inline; currentColor strokes follow the color property.</desc>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" style="stroke:var(--bg-c1,#6366f1)" stroke-opacity="0.35" stroke-width="2"/></pattern><radialGradient id="m"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="k"><rect width="100%" height="100%" fill="url(#m)"/></mask></defs>
<rect width="100%" height="100%" style="fill:var(--bg-bg,#0f172a)"/>
<g style="color:var(--bg-c1,#6366f1)"><rect width="100%" height="100%" fill="url(#g)" mask="url(#k)"/></g>
</svg>
