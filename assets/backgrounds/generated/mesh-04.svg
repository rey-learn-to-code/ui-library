<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
<title>Gradient mesh 4 co hat</title>
<desc>Recolor: set the CSS variables bg-bg, bg-c1, bg-c2, bg-c3 (each prefixed with two hyphens) on the parent element when embedding the SVG inline; currentColor strokes follow the color property.</desc>
<defs><radialGradient id="r0" cx="0.05" cy="0.15" r="0.79"><stop offset="0" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0"/></radialGradient><radialGradient id="r1" cx="0.25" cy="0.08" r="0.53"><stop offset="0" style="stop-color:var(--bg-c2,#ec4899);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c2,#ec4899);stop-opacity:0"/></radialGradient><radialGradient id="r2" cx="0.53" cy="0.39" r="0.72"><stop offset="0" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0"/></radialGradient><radialGradient id="r3" cx="0.34" cy="0.16" r="0.73"><stop offset="0" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0"/></radialGradient><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
<rect width="100%" height="100%" style="fill:var(--bg-bg,#0f172a)"/>
<rect width="100%" height="100%" fill="url(#r0)"/>
<rect width="100%" height="100%" fill="url(#r1)"/>
<rect width="100%" height="100%" fill="url(#r2)"/>
<rect width="100%" height="100%" fill="url(#r3)"/>
<rect width="100%" height="100%" filter="url(#n)" opacity="0.12"/>
</svg>
