<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
<title>Gradient mesh 3</title>
<desc>Recolor: set the CSS variables bg-bg, bg-c1, bg-c2, bg-c3 (each prefixed with two hyphens) on the parent element when embedding the SVG inline; currentColor strokes follow the color property.</desc>
<defs><radialGradient id="r0" cx="0.77" cy="0.79" r="0.54"><stop offset="0" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0"/></radialGradient><radialGradient id="r1" cx="0.89" cy="0.83" r="0.75"><stop offset="0" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c1,#6366f1);stop-opacity:0"/></radialGradient><radialGradient id="r2" cx="0.71" cy="0.97" r="0.75"><stop offset="0" style="stop-color:var(--bg-c2,#ec4899);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c2,#ec4899);stop-opacity:0"/></radialGradient><radialGradient id="r3" cx="0.90" cy="0.42" r="0.52"><stop offset="0" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0.9"/><stop offset="1" style="stop-color:var(--bg-c3,#22d3ee);stop-opacity:0"/></radialGradient></defs>
<rect width="100%" height="100%" style="fill:var(--bg-bg,#0f172a)"/>
<rect width="100%" height="100%" fill="url(#r0)"/>
<rect width="100%" height="100%" fill="url(#r1)"/>
<rect width="100%" height="100%" fill="url(#r2)"/>
<rect width="100%" height="100%" fill="url(#r3)"/>

</svg>
